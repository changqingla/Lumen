name: ${COMPOSE_PROJECT_NAME:-lumen-local}

x-json-logging: &json-logging
  logging:
    driver: json-file
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
      max-file: ${DOCKER_LOG_MAX_FILE:-3}

services:
  lumen_postgres:
    image: ${POSTGRES_IMAGE:-crpi-wh1i56a4x558rrhm.cn-hangzhou.personal.cr.aliyuncs.com/changqinga/postgres:16-alpine}
    container_name: lumen_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reader_qaq}
      POSTGRES_USER: ${POSTGRES_USER:-reader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${LUMEN_LOCAL_BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-/root/data/postgres}:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reader} -d ${POSTGRES_DB:-reader_qaq}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumen_network
    restart: unless-stopped
    <<: *json-logging

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-crpi-wh1i56a4x558rrhm.cn-hangzhou.personal.cr.aliyuncs.com/changqinga/elasticsearch:8.11.3}
    container_name: lumen_elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${LUMEN_LOCAL_BIND_HOST:-127.0.0.1}:${ELASTICSEARCH_HTTP_PORT:-9200}:9200"
      - "${LUMEN_LOCAL_BIND_HOST:-127.0.0.1}:${ELASTICSEARCH_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - ${ELASTICSEARCH_DATA_DIR:-/root/data/es}:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - lumen_network
    restart: unless-stopped
    <<: *json-logging

  redis:
    image: ${REDIS_IMAGE:-crpi-wh1i56a4x558rrhm.cn-hangzhou.personal.cr.aliyuncs.com/changqinga/valkey:8}
    container_name: lumen_redis
    ports:
      - "${LUMEN_LOCAL_BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6378}:6378"
    volumes:
      - ${REDIS_DATA_DIR:-/root/data/redis}:/data
      - ./redis.conf.template:/usr/local/etc/redis/redis.conf.template:ro
    command:
      - sh
      - -lc
      - >-
        sed "s|__REDIS_PASSWORD__|${REDIS_PASSWORD:?REDIS_PASSWORD is required}|g"
        /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf
        && exec redis-server /tmp/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6378", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lumen_network
    restart: unless-stopped
    <<: *json-logging

  lumen_minio:
    image: ${MINIO_IMAGE:-crpi-wh1i56a4x558rrhm.cn-hangzhou.personal.cr.aliyuncs.com/changqinga/minio:RELEASE.2023-12-20T01-00-02Z}
    container_name: lumen_minio
    hostname: lumen_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-reader}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_DOMAIN: ${MINIO_DOMAIN:-minio}
    ports:
      - "${LUMEN_LOCAL_BIND_HOST:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${LUMEN_LOCAL_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${MINIO_DATA_DIR:-/root/data/minio}:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      lumen_network:
        aliases:
          - minio
    restart: unless-stopped
    <<: *json-logging

  lumen_gateway:
    image: ${RUNTIME_IMAGE:-crpi-wh1i56a4x558rrhm.cn-hangzhou.personal.cr.aliyuncs.com/changqinga/lumen:latest}
    container_name: lumen_gateway
    env_file:
      - ../backend/.env
      - ../runtimes/config/.env
    environment:
      CI: "true"
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONPATH: /app/backend
      LUMEN_HOME: /app/state
      LUMEN_CONFIG_PATH: /app/config/config.yaml
      LUMEN_EXTENSIONS_CONFIG_PATH: /app/config/extensions_config.json
      LUMEN_RUNTIME_VENV_DIR: /app/state/runtime-venv
      LUMEN_CHECKPOINTER_TYPE: postgres
      LUMEN_CHECKPOINTER_CONNECTION_STRING: postgresql://${POSTGRES_USER:-reader}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@lumen_postgres:5432/${POSTGRES_DB:-reader_qaq}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-reader}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@lumen_postgres:5432/${POSTGRES_DB:-reader_qaq}
      REDIS_URL: redis://lumen:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6378/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-reader}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${LUMEN_LOCAL_BIND_HOST:-127.0.0.1}:${GATEWAY_HOST_PORT:-8001}:8001"
    volumes:
      - ../runtimes/backend:/app/backend:ro
      - ../runtimes/config:/app/config:ro
      - ../runtimes/skills:/app/skills:ro
      - ${RUNTIME_STATE_DIR:-/root/Lumen/runtimes/state}:/app/state
      - ${RUNTIME_LOG_DIR:-/root/data/logs}:/app/log
    working_dir: /app
    command: ["sh", "-lc", "/app/backend/scripts/run_service.sh gateway python -m src.gateway.run > /app/log/gateway.log 2>&1"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/health")' >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 600s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lumen_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lumen_minio:
        condition: service_healthy
    networks:
      - lumen_network
    restart: unless-stopped
    <<: *json-logging

  lumen_langgraph:
    image: ${RUNTIME_IMAGE:-crpi-wh1i56a4x558rrhm.cn-hangzhou.personal.cr.aliyuncs.com/changqinga/lumen:latest}
    container_name: lumen_langgraph
    env_file:
      - ../backend/.env
      - ../runtimes/config/.env
    environment:
      CI: "true"
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONPATH: /app/backend
      LUMEN_HOME: /app/state
      LUMEN_CONFIG_PATH: /app/config/config.yaml
      LUMEN_EXTENSIONS_CONFIG_PATH: /app/config/extensions_config.json
      LUMEN_RUNTIME_VENV_DIR: /app/state/runtime-venv
      LUMEN_CHECKPOINTER_TYPE: postgres
      LUMEN_CHECKPOINTER_CONNECTION_STRING: postgresql://${POSTGRES_USER:-reader}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@lumen_postgres:5432/${POSTGRES_DB:-reader_qaq}
      # The LangGraph runtime starts sandbox containers through the host Docker
      # daemon, so sandbox callbacks must target the host bridge rather than the
      # runtime container itself.
      LUMEN_SANDBOX_HOST: host.docker.internal
      LUMEN_HOST_BASE_DIR: ${RUNTIME_STATE_DIR:-/root/Lumen/runtimes/state}
      LUMEN_HOST_SKILLS_PATH: /root/Lumen/runtimes/skills
      BG_JOB_ISOLATED_LOOPS: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-reader}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@lumen_postgres:5432/${POSTGRES_DB:-reader_qaq}
      REDIS_URL: redis://lumen:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6378/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-reader}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${LUMEN_LOCAL_BIND_HOST:-127.0.0.1}:${LANGGRAPH_HOST_PORT:-2024}:2024"
    volumes:
      - ../runtimes/backend:/app/backend
      - ../runtimes/config:/app/config:ro
      - ../runtimes/skills:/app/skills:ro
      - ${RUNTIME_STATE_DIR:-/root/Lumen/runtimes/state}:/app/state
      - ${RUNTIME_LOG_DIR:-/root/data/logs}:/app/log
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command:
      - sh
      - -lc
      - >-
        ALLOW_BLOCKING_FLAG="";
        if [ "${LUMEN_LANGGRAPH_ALLOW_BLOCKING:-true}" = "true" ]; then
          ALLOW_BLOCKING_FLAG="--allow-blocking";
        fi;
        /app/backend/scripts/run_service.sh
        langgraph
        langgraph dev --no-browser $$ALLOW_BLOCKING_FLAG --no-reload --host 0.0.0.0 --port 2024
        --n-jobs-per-worker ${LANGGRAPH_N_JOBS_PER_WORKER:-5}
        > /app/log/langgraph.log 2>&1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:2024/docs")' >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 600s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lumen_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lumen_minio:
        condition: service_healthy
    networks:
      - lumen_network
    restart: unless-stopped
    <<: *json-logging

  lumen_api:
    image: ${BACKEND_IMAGE:-crpi-wh1i56a4x558rrhm.cn-hangzhou.personal.cr.aliyuncs.com/changqinga/knowledge-retrieval:v1.2}
    container_name: lumen_api
    env_file:
      - ../backend/.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONDONTWRITEBYTECODE: "1"
      WORKSPACE_ASSET_RULES_PATH: /app/shared/config/workspace_asset_rules.json
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-reader}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@lumen_postgres:5432/${POSTGRES_DB:-reader_qaq}
      REDIS_URL: redis://lumen:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6378/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-reader}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${LUMEN_LOCAL_BIND_HOST:-127.0.0.1}:${API_HOST_PORT:-13000}:13000"
    volumes:
      - ../backend:/app:ro
      - ../shared:/app/shared:ro
      - ../services/rag/core:/workspace/rag/core:ro
    working_dir: /app
    command: ["sh", "-lc", "uvicorn app.main:app --host 0.0.0.0 --port 13000"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:13000/api/health")' >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      lumen_api_migrations:
        condition: service_completed_successfully
      lumen_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lumen_minio:
        condition: service_healthy
    networks:
      - lumen_network
    restart: unless-stopped
    <<: *json-logging

  lumen_api_migrations:
    image: ${BACKEND_IMAGE:-crpi-wh1i56a4x558rrhm.cn-hangzhou.personal.cr.aliyuncs.com/changqinga/knowledge-retrieval:v1.2}
    container_name: lumen_api_migrations
    env_file:
      - ../backend/.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-reader}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@lumen_postgres:5432/${POSTGRES_DB:-reader_qaq}
    volumes:
      - ../backend:/app:ro
    working_dir: /app
    command: ["sh", "-lc", "python run_migrations.py"]
    depends_on:
      lumen_postgres:
        condition: service_healthy
    networks:
      - lumen_network

  rag:
    image: ${RAG_IMAGE:-crpi-wh1i56a4x558rrhm.cn-hangzhou.personal.cr.aliyuncs.com/changqinga/knowledge-retrieval:v1.2}
    container_name: lumen_rag
    working_dir: /workspace/rag/api
    env_file:
      - ../backend/.env
    environment:
      PORT: 7791
      HOST: 0.0.0.0
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_HOST: redis
      REDIS_PORT: 6378
      REDIS_USERNAME: lumen
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: 1
      MAX_CONCURRENT_TASKS: ${RAG_MAX_CONCURRENT_TASKS:-4}
      MAX_WORKERS: ${RAG_MAX_WORKERS:-16}
      CHUNK_PROCESS_WORKERS: ${RAG_CHUNK_PROCESS_WORKERS:-4}
    command: ["python", "api.py"]
    volumes:
      - ../services/rag:/workspace/rag
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "${LUMEN_LOCAL_BIND_HOST:-127.0.0.1}:${RAG_HOST_PORT:-7791}:7791"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:7791/health")' >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lumen_network
    restart: unless-stopped
    <<: *json-logging

  lumen_nginx:
    image: ${NGINX_IMAGE:-crpi-wh1i56a4x558rrhm.cn-hangzhou.personal.cr.aliyuncs.com/changqinga/nginx:latest}
    container_name: lumen_nginx
    environment:
      LUMEN_SERVER_NAME: ${LUMEN_SERVER_NAME:-ireader.online www.ireader.online}
      LUMEN_SSL_CERT_PATH: ${LUMEN_SSL_CERT_PATH:-/etc/letsencrypt/live/ireader.online/fullchain.pem}
      LUMEN_SSL_CERT_KEY_PATH: ${LUMEN_SSL_CERT_KEY_PATH:-/etc/letsencrypt/live/ireader.online/privkey.pem}
    command:
      - /bin/sh
      - -lc
      - |
        envsubst '$$LUMEN_SERVER_NAME $$LUMEN_SSL_CERT_PATH $$LUMEN_SSL_CERT_KEY_PATH' < /etc/nginx/templates/lumen.conf.template > /etc/nginx/conf.d/default.conf &&
        nginx -g 'daemon off;'
    ports:
      - "${LUMEN_HTTP_BIND_HOST:-0.0.0.0}:${LUMEN_HTTP_PORT:-80}:80"
      - "${LUMEN_HTTPS_BIND_HOST:-0.0.0.0}:${LUMEN_HTTPS_PORT:-443}:443"
    volumes:
      - ../docker/nginx/lumen.conf.template:/etc/nginx/templates/lumen.conf.template:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ${LUMEN_TLS_CERTS_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${LUMEN_CERTBOT_WEBROOT_DIR:-/var/www/certbot}:/var/www/certbot:ro
    depends_on:
      lumen_api:
        condition: service_healthy
      lumen_gateway:
        condition: service_healthy
      lumen_langgraph:
        condition: service_healthy
      lumen_minio:
        condition: service_healthy
    networks:
      - lumen_network
    restart: unless-stopped
    <<: *json-logging

networks:
  lumen_network:
    name: ${COMPOSE_PROJECT_NAME:-lumen}_network
