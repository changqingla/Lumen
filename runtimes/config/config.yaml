# ============================================================================
# 工具组配置
# ============================================================================
# 定义工具分组，用于组织和访问控制

tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash

# ============================================================================
# 工具配置
# ============================================================================
# 配置 Agent 可用的工具

tools:
  # Web 搜索工具（需要 Tavily API Key）
  - name: web_search
    group: web
    use: src.community.tavily.tools:web_search_tool
    max_results: 5
    api_key: $TAVILY_API_KEY  

  # Web 搜索工具（需要 InfoQuest API Key）
  # - name: web_search
  #   group: web
  #   use: src.community.infoquest.tools:web_search_tool
  #   # 用于限制搜索结果范围，只返回指定时间区间内的内容。设为 -1 可关闭时间过滤
  #   search_time_range: 10

  # Web 抓取工具（使用 Jina AI reader）
  - name: web_fetch
    group: web
    use: src.community.jina_ai.tools:web_fetch_tool
    timeout: 10

  # Web 抓取工具（使用 InfoQuest AI reader）
  # - name: web_fetch
  #   group: web
  #   use: src.community.infoquest.tools:web_fetch_tool
  #   # 整体抓取流程超时时间（秒）。设为正数启用，设为 -1 禁用
  #   timeout: 10
  #   # 页面加载后的等待时间（秒）。设为正数启用，设为 -1 禁用
  #   fetch_time: 10
  #   # 页面导航超时时间（秒）。设为正数启用，设为 -1 禁用
  #   navigation_timeout: 30

  # 图片搜索工具（使用 DuckDuckGo）
  # 可在生成图片前先检索参考图
  - name: image_search
    group: web
    use: src.community.image_search.tools:image_search_tool
    max_results: 5

  # 文件操作工具
  - name: ls
    group: file:read
    use: src.sandbox.tools:ls_tool

  - name: read_file
    group: file:read
    use: src.sandbox.tools:read_file_tool

  - name: write_file
    group: file:write
    use: src.sandbox.tools:write_file_tool

  - name: str_replace
    group: file:write
    use: src.sandbox.tools:str_replace_tool

  # Bash 执行工具
  - name: bash
    group: bash
    use: src.sandbox.tools:bash_tool

# ============================================================================
# 上传配置
# ============================================================================
# 控制哪些上传文件扩展名会额外转换为 Markdown。
# 未列出的文件会按原样上传，不会生成对应的 `.md` 副本。

uploads:
  markdown_extensions:
    - .pdf
    - .ppt
    - .pptx
    - .xls
    - .xlsx
    # - .doc
    # - .docx

# ============================================================================
# Agent Loop 配置
# ============================================================================
# 控制模型与工具循环中的运行时保护策略。

agent_loop:
  # 在单轮对话中，允许同一个工具以相同参数被调用的最大次数
  # 超过这个次数后，循环保护机制会阻止继续调用
  max_identical_tool_calls: 4

# ============================================================================
# 沙箱配置
# ============================================================================
# 可选择本地沙箱（直接执行）或基于 Docker 的 AIO 沙箱

# 方案 1：本地沙箱
# 直接在宿主机上执行命令
# sandbox:
#   use: src.sandbox.local:LocalSandboxProvider

# 方案 2：基于容器的 AIO 沙箱（默认）
# 在隔离容器中执行命令（Docker 或 Apple Container）
# 在 macOS 上：如果可用会优先使用 Apple Container，否则回退到 Docker
# 在其他平台上：使用 Docker
sandbox:
  use: src.community.aio_sandbox:AioSandboxProvider

#   # 可选：沙箱容器基础端口（默认：8080）
#   # port: 8080

#   # 可选：最大并发沙箱容器数（默认：5）
#   # 达到上限时，会淘汰最近最少使用的沙箱，以腾出空间给新的沙箱
#   # 这里请填写正整数；省略该字段则使用默认值
#   # replicas: 5
#
#   # 可选：容器名前缀（默认：lumen-sandbox）
#   # container_prefix: lumen-sandbox
#
#   # 可选：从宿主机挂载到容器的额外目录
#   # 注意：技能目录会自动从 skills.path 挂载到 skills.container_path
#   # mounts:
#   #   # 其他自定义挂载
#   #   - host_path: /path/on/host
#   #     container_path: /home/user/shared
#   #     read_only: false
#
#   # 可选：注入到沙箱容器内的环境变量
#   # 以 $ 开头的值会从宿主机环境变量中解析
#   # environment:
#   #   NODE_ENV: production
#   #   DEBUG: "false"
#   #   API_KEY: $MY_API_KEY         # 读取宿主机的 MY_API_KEY 环境变量
#   #   DATABASE_URL: $DATABASE_URL  # 读取宿主机的 DATABASE_URL 环境变量

# 方案 3：由 Provisioner 管理的 AIO 沙箱（与根目录 docker/docker-compose.yml 协同）
# 每个 sandbox_id 会在 k3s 中对应一个专属 Pod，由 provisioner 统一管理。
# 推荐用于生产环境，或对隔离性和可扩展性有更高要求的高级用户。:
# sandbox:
#   use: src.community.aio_sandbox:AioSandboxProvider
#   provisioner_url: http://provisioner:8002

# ============================================================================
# 子 Agent 配置
# ============================================================================
# 配置子 Agent 的执行超时时间
# 子 Agent 是由主 Agent 委派任务的后台工作单元

# subagents:
#   # 所有子 Agent 的默认超时时间（秒，默认：900，即 15 分钟）
#   timeout_seconds: 900
#
#   # 可选：按 Agent 单独覆盖超时时间
#   agents:
#     general-purpose:
#       timeout_seconds: 1800  # 复杂多步骤任务使用 30 分钟
#     bash:
#       timeout_seconds: 300   # 快速命令执行使用 5 分钟

# ============================================================================
# 技能配置
# ============================================================================
# 配置技能目录，用于专门化的 Agent 工作流

skills:
  # 宿主机上的技能目录路径（可以是相对项目根目录的路径，也可以是绝对路径）
  # 默认值：../skills（相对于 backend 目录）
  # 如需自定义请取消注释：
  # path: /absolute/path/to/custom/skills

  # 技能在沙箱容器中的挂载路径
  # Agent 会通过这个路径在本地沙箱和 Docker 沙箱中访问技能
  # 默认值：/mnt/skills
  container_path: /mnt/skills

# ============================================================================
# 标题生成配置
# ============================================================================
# 自动生成对话标题的相关设置

title:
  enabled: false
  max_words: 6
  max_chars: 60
  model_name: qwen3.5-flash # 使用默认模型（models 列表中的第一个）

# ============================================================================
# 摘要配置
# ============================================================================
# 当接近 token 上限时自动总结对话历史
# 这样可以在长对话中保留上下文，同时避免超出模型限制

summarization:
  enabled: true

  # 用于摘要的模型（null 表示使用默认模型）
  # 建议使用轻量且成本较低的模型，例如 "gpt-4o-mini" 或类似模型
  model_name: null

  # 触发条件：至少需要一个
  # 只要满足任意一个阈值（OR 逻辑）就会执行摘要
  # 你可以配置单个触发器，也可以配置一组触发器
  trigger:
    # 当 token 数达到 15564 时触发
    - type: tokens
      value: 75564
    # 取消注释后，也会在消息数达到 50 时触发
    # - type: messages
    #   value: 50
    # 取消注释后，也会在达到模型最大输入 token 的 80% 时触发
    # - type: fraction
    #   value: 0.8

  # 摘要后的上下文保留策略
  # 用于指定保留多少最近的历史内容
  keep:
    # 保留最近 10 条消息（推荐）
    type: messages
    value: 10
    # 可选：按指定 token 数保留
    # type: tokens
    # value: 3000
    # 可选：按模型最大输入 token 的比例保留
    # type: fraction
    # value: 0.3

  # 为生成摘要而准备消息时，允许保留的最大 token 数
  # 设为 null 可跳过裁剪（不建议用于超长对话）
  trim_tokens_to_summarize: 75564

  # 自定义摘要提示词模板（null 表示使用默认 LangChain prompt）
  # 提示词应引导模型提取重要上下文
  summary_prompt: null

# ============================================================================
# 记忆配置
# ============================================================================
# 全局记忆机制
# 用于存储用户上下文和对话历史，以支持个性化回复
memory:
  enabled: false
  storage_path: memory.json # 相对于 backend 目录的路径
  debounce_seconds: 30 # 处理队列更新前的等待时间
  model_name: null # 使用默认模型
  max_facts: 100 # 最多存储的事实数量
  fact_confidence_threshold: 0.7 # 存储事实所需的最低置信度
  injection_enabled: true # 是否将记忆注入到系统提示词中
  max_injection_tokens: 2000 # 记忆注入允许使用的最大 token 数

# ============================================================================
# Checkpointer 配置
# ============================================================================
# 配置内嵌 InsightFlowClient 的状态持久化方式。
# LangGraph Server 会通过其自身基础设施独立管理状态持久化，
# 不受这里的设置影响。
#
# 配置后，InsightFlowClient 会自动使用该 checkpointer，
# 从而让多轮对话在进程重启后仍能保留。
#
# 支持的类型：
#   memory   - 仅进程内有效。进程退出后状态会丢失。（默认）
#   postgres - PostgreSQL 持久化。适合多进程部署。
#              需要安装：uv add langgraph-checkpoint-postgres psycopg[binary] psycopg-pool
#
# 示例：
#
# 内存模式（默认，省略时即为该模式，不会持久化）：
# checkpointer:
#   type: memory
#
# PostgreSQL（多进程，生产环境）：
checkpointer:
  type: $LUMEN_CHECKPOINTER_TYPE
  connection_string: $LUMEN_CHECKPOINTER_CONNECTION_STRING

# ============================================================================
