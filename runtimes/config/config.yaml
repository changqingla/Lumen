# lumen 应用配置
#
# 使用说明：
# - 将此文件复制为 `config.yaml`，并根据你的环境进行调整
# - 该配置文件默认位于当前工作目录下的 `config.yaml`
#   你也可以通过 `LUMEN_CONFIG_PATH` 环境变量指定其他路径
# - 所有字段值都支持环境变量，例如：`api_key: $OPENAI_API_KEY`
# - `use` 字段是一个字符串，格式类似：`package_name.sub_package_name.module_name:class_name/variable_name`

# ============================================================================
# 模型配置
# ============================================================================
# 配置 Agent 可用的大语言模型
models:
  # - name: qwen3.5-flash
  #   display_name: qwen3.5-flash
  #   use: langchain_openai:ChatOpenAI
  #   model: qwen3.5-flash
  #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   api_key: $DASHSCOPE_API_KEY
  #   max_tokens: 32648
  #   temperature: 0.7
  #   supports_thinking: true
  #   supports_vision: true
  #   extra_body:
  #     chat_template_kwargs:
  #       enable_thinking: false

  - name: gpt-5.3-codex
    display_name: gpt-5.3-codex
    use: langchain_openai:ChatOpenAI
    model: gpt-5.3-codex
    base_url: $XCODE_API_BASE_URL
    api_key: $XCODE_API_KEY
    timeout: 240
    supports_thinking: false
    supports_reasoning_effort: true
    supports_vision: true

  - name: gpt-5.4
    display_name: gpt-5.4
    use: langchain_openai:ChatOpenAI
    model: gpt-5.4
    base_url: $XCODE_API_BASE_URL
    api_key: $XCODE_API_KEY
    timeout: 240
    supports_thinking: false
    supports_reasoning_effort: true
    supports_vision: true

  # - name: qwen3.6-plus
